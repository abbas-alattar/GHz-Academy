<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — GHz Academy</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./portal.css" />
  <link rel="stylesheet" href="./AuthPageV2.css" />
</head>
<body>
  <div id="authV2Root"></div>
  <div id="authClassic" class="hidden">
  <div class="login-wrap">
    <aside class="login-art">
      <a class="brand" href="./index.html" aria-label="GHz Academy">
        <svg viewBox="0 0 40 22" fill="none" aria-hidden="true"><path d="M2 11c3-8 7-8 10 0s7 8 10 0 7-8 10 0 4 6 6 0" stroke="#2EC8FF" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="ghz">GHz</span> <span class="acad">Academy</span>
      </a>
      <p>Learn wireless, from LTE to 6G</p>
    </aside>
    <main class="login-panel">
      <div class="card">
        <div id="authForms">
          <div class="form-msg ok" id="welcomeBanner" style="margin-bottom:12px">Welcome to GHz Academy! Your password is set. Log in to access your trainer portal.</div>
          <div class="tabs" role="tablist">
            <button type="button" class="on" id="tabLogin" role="tab" aria-selected="true">Log in</button>
            <button type="button" id="tabSignup" role="tab" aria-selected="false">Create account</button>
          </div>
          <form id="loginForm">
            <label for="lemail">Email</label>
            <input id="lemail" type="email" required autocomplete="email" />
            <label for="lpw">Password</label>
            <div class="pw"><input id="lpw" type="password" required autocomplete="current-password" /><button type="button" data-toggle="lpw">Show</button></div>
            <a class="forgot" href="#" id="forgot">Forgot password</a>
            <button class="btn" id="loginBtn" type="submit">Log in</button>
          </form>
          <form id="signupForm" class="hidden">
            <label for="sname">Full name</label>
            <input id="sname" required autocomplete="name" />
            <label for="semail">Email</label>
            <input id="semail" type="email" required autocomplete="email" />
            <label for="spw">Password</label>
            <div class="pw"><input id="spw" type="password" required minlength="6" autocomplete="new-password" /><button type="button" data-toggle="spw">Show</button></div>
            <label for="spw2">Confirm password</label>
            <div class="pw"><input id="spw2" type="password" required minlength="6" autocomplete="new-password" /><button type="button" data-toggle="spw2">Show</button></div>
            <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px">
              <input id="sagree" type="checkbox" required style="width:auto;margin-top:3px" />
              <span>I agree to the <a href="./terms/" target="_blank" rel="noopener noreferrer">Terms & Conditions</a> and <a href="./privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a></span>
            </label>
            <button class="btn" id="signupBtn" type="submit">Create student account</button>
          </form>
          <div class="form-msg err" id="err" role="alert"></div>
          <div class="form-msg ok" id="ok"></div>
        </div>
        <div id="verifyScreen" class="hidden">
          <h1 style="font-size:1.4rem;margin-bottom:8px">Check your email</h1>
          <p style="color:var(--muted);line-height:1.6">We sent a verification link. Open it, then continue.</p>
          <p style="color:var(--muted);margin:8px 0 12px">Can't find it? Check your spam folder.</p>
          <button class="btn" id="resendBtn" type="button">Resend email</button>
          <button class="btn" id="continueBtn" type="button" style="background:#0e3a5d">I've verified, continue</button>
          <div class="err" id="verr" role="alert"></div>
        </div>
      </div>
      <p style="text-align:center;margin-top:16px;font-size:.85rem"><a href="./terms/" target="_blank" rel="noopener noreferrer">Terms & Conditions</a> · <a href="./privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy</a></p>
    </main>
  </div>
  </div>
  <script type="module">
    import {
      createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification,
      sendPasswordResetEmail, updateProfile, reload, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    import { auth, db, roleHome } from "./firebase-config.js?v=auth8";
    import { ensureLocalPersistence, broadcastLogin, watchCrossTab } from "./auth-sync.js?v=auth9";
    import { markLoginActivity } from "./lastActive.js";
    import { assignStudentIdTx } from "./studentId.js";
    import { renderAuthPageV2 } from "./AuthPageV2.js";

    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    const showErr = (el, msg) => { el.style.display = "block"; el.textContent = msg; };
    const hide = (el) => { el.style.display = "none"; el.textContent = ""; };
    const friendly = (e) => {
      const c = e?.code || "";
      if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "Email or password is not correct.";
      if (c.includes("email-already-in-use")) return "That email already has an account. Try logging in.";
      if (c.includes("weak-password")) return "Use at least 6 characters for your password.";
      if (c.includes("too-many")) return "Too many attempts. Please wait a moment.";
      if (c.includes("network")) return "Network error. Check your connection and try again.";
      if (c.includes("permission-denied")) return "Could not save your profile. Please try logging in.";
      return (e?.message || "Something went wrong. Please try again.") + (c ? " (" + c + ")" : "");
    };

    document.querySelectorAll("[data-toggle]").forEach((b) => {
      b.onclick = () => {
        const i = document.getElementById(b.dataset.toggle);
        i.type = i.type === "password" ? "text" : "password";
        b.textContent = i.type === "password" ? "Show" : "Hide";
      };
    });
    const tabLogin = document.getElementById("tabLogin");
    const tabSignup = document.getElementById("tabSignup");
    tabLogin.onclick = () => {
      tabLogin.classList.add("on"); tabSignup.classList.remove("on");
      tabLogin.setAttribute("aria-selected", "true"); tabSignup.setAttribute("aria-selected", "false");
      document.getElementById("loginForm").classList.remove("hidden");
      document.getElementById("signupForm").classList.add("hidden");
      hide(err); hide(ok);
    };
    const showSignup = () => {
      tabSignup.classList.add("on"); tabLogin.classList.remove("on");
      tabSignup.setAttribute("aria-selected", "true"); tabLogin.setAttribute("aria-selected", "false");
      document.getElementById("signupForm").classList.remove("hidden");
      document.getElementById("loginForm").classList.add("hidden");
      hide(err); hide(ok);
    };
    tabSignup.onclick = showSignup;

    const goRole = async (user) => {
      let data = { role: "student", active: true };
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) data = snap.data();
      } catch (ex) {
        showErr(err, friendly(ex));
        data = { role: "student", active: true };
      }
      if (data.active === false) {
        const { signOut } = await import("https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js");
        await signOut(auth);
        showErr(err, "Your account is disabled.");
        return;
      }
      if (data.role === "student" && !user.emailVerified) {
        showVerify();
        return;
      }
      const qs = new URLSearchParams(location.search);
      const next = qs.get("next");
      let courseId = qs.get("course") || "";
      try { if (!courseId) courseId = sessionStorage.getItem("ghz-reg-course") || ""; } catch {}
      if (data.role === "student" && courseId && (next === "register" || next === "1" || qs.get("tab") === "signup" || courseId)) {
        location.replace("./student.html#register/" + encodeURIComponent(courseId));
        return;
      }
      const safeNext = next && next.startsWith("./") && !next.startsWith("./login") ? next : null;
      location.replace(safeNext || roleHome[data.role] || "./student.html");
    };
    const params = new URLSearchParams(location.search);
    if (params.get("disabled")) showErr(err, "Your account is disabled.");
    if (params.get("welcome") === "trainer") {
      document.getElementById("welcomeBanner").style.display = "block";
    } else {
      document.getElementById("welcomeBanner").style.display = "none";
    }
    if (params.get("tab") === "signup") showSignup();
    ensureLocalPersistence();
    watchCrossTab({
      onLogin: () => { const u = auth.currentUser; if (u) goRole(u); }
    });
    onAuthStateChanged(auth, (user) => {
      if (user && document.getElementById("loginForm") === document.activeElement) return;
      if (user && !document.getElementById("signupForm").classList.contains("hidden")) return;
      if (user && !document.getElementById("verifyScreen").classList.contains("hidden")) return;
      if (user) { broadcastLogin(user.uid); goRole(user); }
    });
    const showVerify = () => {
      document.getElementById("authForms").classList.add("hidden");
      document.getElementById("verifyScreen").classList.remove("hidden");
    };

    document.getElementById("loginForm").onsubmit = async (e) => {
      e.preventDefault(); hide(err); hide(ok);
      const btn = document.getElementById("loginBtn");
      btn.disabled = true; btn.textContent = "Logging in…";
      try {
        const cred = await signInWithEmailAndPassword(auth, document.getElementById("lemail").value.trim(), document.getElementById("lpw").value);
        markLoginActivity(cred.user?.uid);
        broadcastLogin(cred.user?.uid);
        await goRole(cred.user);
      } catch (ex) { showErr(err, friendly(ex)); }
      finally { btn.disabled = false; btn.textContent = "Log in"; }
    };

    document.getElementById("signupForm").onsubmit = async (e) => {
      e.preventDefault(); hide(err); hide(ok);
      const name = document.getElementById("sname").value.trim();
      const email = document.getElementById("semail").value.trim();
      const pw = document.getElementById("spw").value;
      const pw2 = document.getElementById("spw2").value;
      if (pw !== pw2) { showErr(err, "Passwords do not match."); return; }
      if (!document.getElementById("sagree").checked) { showErr(err, "Please agree to the Terms & Conditions and Privacy Policy."); return; }
      const btn = document.getElementById("signupBtn");
      btn.disabled = true; btn.textContent = "Creating account…";
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pw);
        try { await updateProfile(cred.user, { displayName: name }); } catch (_) {}
        try {
          const phoneEl = document.getElementById("sphone");
          const extra = {
            phone: String(phoneEl?.value || ""),
            phoneCountry: String(document.getElementById("sphoneCountry")?.value || ""),
            phoneDial: String(document.getElementById("sphoneDial")?.value || "")
          };
          await setDoc(doc(db, "users", cred.user.uid), { uid: cred.user.uid, name, email, role: "student", active: true, createdAt: serverTimestamp(), termsAcceptedAt: serverTimestamp(), ...extra });
        } catch (writeErr) {
          showErr(err, friendly(writeErr));
        }
        try { await sendEmailVerification(cred.user); } catch (_) {}
        try {
          const idRes = await assignStudentIdTx(cred.user.uid, { source: "signup", assignedBy: cred.user.uid });
          if (!idRes.ok) console.warn("studentId", idRes.error);
        } catch (idErr) { console.warn("studentId", idErr?.code || idErr); }
        showVerify();
      } catch (ex) { showErr(err, friendly(ex)); }
      finally { btn.disabled = false; btn.textContent = "Create student account"; }
    };

    document.getElementById("forgot").onclick = async (e) => {
      e.preventDefault(); hide(err); hide(ok);
      const email = document.getElementById("lemail").value.trim();
      if (!email) { showErr(err, "Enter your email first, then tap Forgot password."); return; }
      try { await sendPasswordResetEmail(auth, email); ok.style.display = "block"; ok.textContent = "Password reset email sent."; }
      catch (ex) { showErr(err, friendly(ex)); }
    };

    let wait = 0;
    const resendBtn = document.getElementById("resendBtn");
    const tick = () => {
      if (wait <= 0) { resendBtn.disabled = false; resendBtn.textContent = "Resend email"; return; }
      resendBtn.disabled = true; resendBtn.textContent = "Resend email (" + wait + "s)";
      wait -= 1; setTimeout(tick, 1000);
    };
    resendBtn.onclick = async () => {
      const u = auth.currentUser; if (!u) return;
      wait = 60; tick();
      try { await sendEmailVerification(u); } catch (ex) { showErr(document.getElementById("verr"), friendly(ex)); }
    };
    document.getElementById("continueBtn").onclick = async () => {
      const u = auth.currentUser; if (!u) { location.replace("./login.html"); return; }
      await reload(u);
      if (!u.emailVerified) { showErr(document.getElementById("verr"), "Email is not verified yet. Open the link in your inbox."); return; }
      await goRole(u);
    };

    const packErr = (ex) => {
      const c = ex?.code || "";
      return { ok: false, message: friendly(ex), code: c };
    };
    const v2host = document.getElementById("authV2Root");
    const classic = document.getElementById("authClassic");
    const onClassic = () => { if (v2host) v2host.hidden = true; if (classic) classic.classList.remove("hidden"); };
    const api = {
      onClassic,
      login: async (email, password) => {
        try {
          const cred = await signInWithEmailAndPassword(auth, email, password);
          markLoginActivity(cred.user?.uid);
          broadcastLogin(cred.user?.uid);
          await goRole(cred.user);
          return { ok: true };
        } catch (ex) { return packErr(ex); }
      },
      signup: async ({ name, email, password, phone, phoneCountry, phoneDial }) => {
        try {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          try { await updateProfile(cred.user, { displayName: name }); } catch (_) {}
          try {
            await setDoc(doc(db, "users", cred.user.uid), {
              uid: cred.user.uid, name, email, role: "student", active: true,
              createdAt: serverTimestamp(), termsAcceptedAt: serverTimestamp(),
              phone: String(phone || ""), phoneCountry: String(phoneCountry || ""), phoneDial: String(phoneDial || "")
            });
          } catch (writeErr) { return packErr(writeErr); }
          try { await sendEmailVerification(cred.user); } catch (_) {}
          try {
            const idRes = await assignStudentIdTx(cred.user.uid, { source: "signup", assignedBy: cred.user.uid });
            if (!idRes.ok) console.warn("studentId", idRes.error);
          } catch (idErr) { console.warn("studentId", idErr?.code || idErr); }
          return { ok: true };
        } catch (ex) { return packErr(ex); }
      },
      forgot: async (email) => {
        try {
          const continueUrl = new URL("./login.html", location.href).href;
          await sendPasswordResetEmail(auth, email, { url: continueUrl, handleCodeInApp: false });
          return { ok: true };
        } catch (ex) { return packErr(ex); }
      },
      resend: async () => {
        try {
          const u = auth.currentUser; if (!u) return { ok: false, message: "Not signed in", code: "" };
          await sendEmailVerification(u);
          return { ok: true };
        } catch (ex) { return packErr(ex); }
      }
    };
    try {
      const okV2 = renderAuthPageV2(v2host, api);
      if (!okV2) onClassic();
      else if (classic) classic.classList.add("hidden");
    } catch (_) { onClassic(); }
  </script>
</body>
</html>

tion(){scan();setTimeout(scan,800);setTimeout(scan,2000);});})();</script>
