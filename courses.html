  <style id="page-courses-nav">
    body.page-courses { margin: 0; padding-top: 0 !important; background: #f4f7fb; }
    body.page-courses nav#siteNav,
    body.page-courses nav#siteNav.scrolled {
      background-color: #0F2747 !important;
      background-image: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      opacity: 1 !important;
      position: sticky !important;
      top: 0 !important;
      z-index: 50 !important;
      height: 72px !important;
      color: #FFFFFF !important;
    }
    body.page-courses .nav-mid a { color: #FFFFFF !important; }

<body class="pc1-page page-courses">
  <nav id="siteNav" class="site-header">
    <a class="brand" href="./index.html" aria-label="GHz Academy">
      <svg viewBox="0 0 40 22" fill="none" aria-hidden="true"><path d="M2 11c3-8 7-8 10 0s7 8 10 0 7-8 10 0 4 6 6 0" stroke="#2EC8FF" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span class="ghz">GHz</span> <span class="acad">Academy</span>
    </a>
    <ul class="nav-mid" id="navLinks">
      <span class="nav-pill" id="navPill" aria-hidden="true"></span>
      <li><a href="./index.html">Home</a></li>
      <li><a class="on" href="./courses.html">Courses</a></li>
      <li><a href="./index.html#about">About</a></li>
      <li><a href="./index.html#leadership">Leadership</a></li>
      <li><a href="./index.html#faq">FAQ</a></li>
      <li><a href="./index.html#contact">Contact</a></li>
      <li class="land-m-auth">
        <a href="./login.html">Login</a>
        <a href="./login.html?tab=signup">Register</a>
      </li>
    </ul>
    <div class="nav-right">
      <div id="landAuthSlot" data-login-label="Log in" aria-live="polite"></div>
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </nav>
  <header class="pc1-cathero">
    <div class="pc1-wrap">
      <h1>Explore our courses</h1>
      <p class="pc1-sub">Practical telecom engineering courses, from LTE to 6G, taught by industry experts.</p>
    </div>
  </header>
  <div class="pc1-tools">
    <input class="pc1-search" id="pc1Search" type="search" placeholder="Search title, trainer, or topic" aria-label="Search courses" />
    <div class="pc1-filts">
      <div class="pc1-chips" role="group" aria-label="Level">
        <button type="button" class="pc1-chip lv on" data-v="All">All</button>
        <button type="button" class="pc1-chip lv" data-v="Foundation">Foundation</button>
        <button type="button" class="pc1-chip lv" data-v="Intermediate">Intermediate</button>
        <button type="button" class="pc1-chip lv" data-v="Advanced">Advanced</button>
      </div>
      <div class="pc1-fdiv" aria-hidden="true"></div>
      <div class="pc1-chips" role="group" aria-label="Status">
        <button type="button" class="pc1-chip st" data-v="Open">Ongoing</button>
        <button type="button" class="pc1-chip st" data-v="Coming soon">Scheduled</button>
      </div>
    </div>
    <select class="pc1-sort" id="pc1Sort" aria-label="Sort courses">
      <option value="soon">Scheduled first</option>
      <option value="price">Price</option>
      <option value="title">Title</option>
    </select>
    <p class="pc1-count" id="pc1Count"></p>
  </div>
  <div class="pc1-grid" id="pc1Grid"></div>
  <div class="pc1-modal" id="pc1Modal" hidden></div>
  <div id="pc1Root"></div>
  <script src="./public-scroll.js"></script>
  <script type="module" src="./landing-header-auth.js?v=auth11"></script>
  <script type="module" src="./PublicCoursesV1.js?v=23"></script>
  <script>
    document.getElementById("menuBtn")?.addEventListener("click", () => document.getElementById("navLinks")?.classList.toggle("show"));
    (function () {
      const nav = document.getElementById("siteNav");
      const home = document.querySelector("#navLinks a[href='./index.html']");
      try {
        const bg = nav ? getComputedStyle(nav).backgroundColor : "";
        const lc = home ? getComputedStyle(home).color : "";
        console.log("[ghz-header] bg", bg);
        console.log("[ghz-header] link color", lc);
      } catch {}
    })();
  </script>
  <script src="./ghz-mobile.js"></script>
